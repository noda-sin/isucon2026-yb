{
  "services": {
    "master-asia": {
      "networks": {
        "netem-lab": {
          "ipv4_address": "172.29.1.10"
        }
      }
    },
    "netem-master-asia": {
      "profiles": [
        "netem"
      ],
      "image": "isureal-local-netem:dev",
      "build": {
        "context": ".",
        "dockerfile": "docker/local/netem/Dockerfile"
      },
      "network_mode": "service:master-asia",
      "depends_on": {
        "master-asia": {
          "condition": "service_started",
          "restart": true
        }
      },
      "cap_drop": [
        "ALL"
      ],
      "cap_add": [
        "NET_ADMIN"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "read_only": true,
      "tmpfs": [
        "/run:rw,noexec,nosuid,size=8m"
      ],
      "environment": {
        "NETEM_REGION": "asia",
        "NETEM_SOURCE_IP": "172.29.1.10",
        "NETEM_TARGET_SERVICE": "master-asia",
        "NETEM_RTT_MS": "${NETEM_RTT_MS:-100}",
        "NETEM_APPROVED": "${NETEM_APPROVED:-no}"
      },
      "restart": "no",
      "stop_grace_period": "90s",
      "mem_limit": "64m",
      "pids_limit": 32,
      "healthcheck": {
        "test": [
          "CMD",
          "python3",
          "/opt/netem/controller.py",
          "status"
        ],
        "interval": "15s",
        "timeout": "10s",
        "retries": 3
      }
    },
