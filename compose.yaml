{
  "name": "isureal-local",
  "services": {
    "master-asia": {
      "image": "yugabytedb/yugabyte:2025.2.8.0-b60",
      "command": [
        "/home/yugabyte/bin/yb-master",
        "--master_addresses=master-asia:7100,master-europe:7100,master-america:7100",
        "--rpc_bind_addresses=master-asia:7100",
        "--fs_data_dirs=/var/lib/yugabyte",
        "--replication_factor=3",
        "--placement_cloud=local",
        "--placement_region=asia",
        "--placement_zone=asia",
        "--memory_limit_hard_bytes=268435456",
        "--num_cpus=2",
        "--default_memory_limit_to_ram_ratio=0.1"
      ],
      "volumes": [
        "master-asia:/var/lib/yugabyte"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -fsS http://master-asia:7000/api/v1/masters >/dev/null"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "30s"
      },
      "restart": "unless-stopped",
      "mem_limit": "512m",
      "ports": [
        "127.0.0.1:17000:7000"
      ]
    },
    "tserver-asia-1": {
      "image": "yugabytedb/yugabyte:2025.2.8.0-b60",
      "command": [
        "/home/yugabyte/bin/yb-tserver",
        "--tserver_master_addrs=master-asia:7100,master-europe:7100,master-america:7100",
        "--rpc_bind_addresses=tserver-asia-1:9100",
        "--pgsql_proxy_bind_address=0.0.0.0:5433",
        "--fs_data_dirs=/var/lib/yugabyte",
        "--placement_cloud=local",
        "--placement_region=asia",
        "--placement_zone=asia",
        "--start_cql_proxy=false",
        "--enable_ysql=true",
        "--memory_limit_hard_bytes=402653184",
        "--num_cpus=2",
        "--yb_enable_read_committed_isolation=true",
        "--enable_wait_queues=true",
        "--enable_object_locking_for_table_locks=true",
        "--ysql_yb_ddl_transaction_block_enabled=true",
        "--ysql_yb_enable_advisory_locks=true",
        "--use_tablespace_based_transaction_placement=true",
        "--ysql_num_shards_per_tserver=1",
        "--yb_num_shards_per_tserver=1",
        "--ysql_pg_conf_csv=max_connections=20,shared_buffers=32MB",
        "--durable_wal_write=true"
      ],
      "volumes": [
        "tserver-asia-1:/var/lib/yugabyte"
      ],
      "depends_on": {
        "master-asia": {
          "condition": "service_healthy"
        },
        "master-europe": {
          "condition": "service_healthy"
        },
        "master-america": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "/home/yugabyte/bin/ysqlsh -h localhost -p 5433 -U yugabyte -d yugabyte -Atqc 'SELECT 1' | grep -qx 1"
        ],
        "interval": "15s",
        "timeout": "10s",
        "retries": 40,
        "start_period": "60s"
      },
      "restart": "unless-stopped",
      "mem_limit": "800m",
      "ports": [
        "127.0.0.1:15433:5433"
      ]
    },
