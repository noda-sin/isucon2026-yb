    "db-init": {
      "entrypoint": [
        "bash",
        "/local/init.sh"
      ],
      "environment": {
        "PGHOST": "tserver-asia-1",
        "PGPORT": "5433",
        "PGUSER": "yugabyte",
        "PGDATABASE": "isureal",
        "SEED_MODE": "${SEED_MODE:-smoke}",
        "EXTERNAL_SEED": "/seed/data.sql"
      },
      "depends_on": {
        "tserver-asia-1": {
          "condition": "service_healthy"
        },
        "tserver-asia-2": {
          "condition": "service_healthy"
        },
        "tserver-europe-1": {
          "condition": "service_healthy"
        },
        "tserver-europe-2": {
          "condition": "service_healthy"
        },
        "tserver-america-1": {
          "condition": "service_healthy"
        },
        "tserver-america-2": {
          "condition": "service_healthy"
        }
      },
      "restart": "no",
      "build": {
        "context": ".",
        "dockerfile": "docker/local/Dockerfile.init"
      }
    },
    "app-asia": {
      "build": {
        "context": ".",
        "dockerfile": "docker/local/Dockerfile.app"
      },
      "environment": {
        "ISUREAL_REGION": "asia",
        "ISUREAL_DB_HOST": "tserver-asia-1",
        "ISUREAL_DB_PORT": "5433",
        "ISUREAL_DB_USER": "yugabyte",
        "ISUREAL_DB_NAME": "isureal",
        "ISUREAL_DB_SSLMODE": "disable",
        "ISUREAL_DB_MAX_OPEN_CONNS": "4",
        "ISUREAL_DISABLE_INITIALIZE": "true"
      },
      "depends_on": {
        "db-init": {
          "condition": "service_completed_successfully"
        }
      },
      "restart": "unless-stopped",
      "mem_limit": "256m",
      "image": "isureal-local/app:dev"
    },
